<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Fiches de révisions – Le sourcing</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#f4f5fb;--card:#fff;--ink:#1e1b4b;--mut:#55587a;--pri:#4338ca;--acc:#0f766e;--exbg:#e6f4f1;--line:#d9dbee}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--bg:#12122a;--card:#1c1c3a;--ink:#eceefc;--mut:#a9acd0;--pri:#a5b4fc;--acc:#5eead4;--exbg:#12332f;--line:#33355e}}
:root[data-theme="dark"]{color-scheme:dark;--bg:#12122a;--card:#1c1c3a;--ink:#eceefc;--mut:#a9acd0;--pri:#a5b4fc;--acc:#5eead4;--exbg:#12332f;--line:#33355e}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.top{background:#312e81;color:#fff;text-align:center;padding:14px 16px;font-weight:700;font-size:clamp(15px,3.2vw,20px);letter-spacing:.2px}
.tabs{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;padding:14px 12px 4px}
.tabs button{border:1px solid var(--line);background:var(--card);color:var(--ink);padding:9px 16px;border-radius:999px;font:inherit;font-weight:600;cursor:pointer}
.tabs button[aria-selected="true"]{background:var(--pri);color:#fff;border-color:var(--pri)}
@media (prefers-color-scheme:dark){.tabs button[aria-selected="true"]{color:#12122a}}
main{max-width:920px;margin:0 auto;padding:10px 14px 24px}
.meta{display:flex;justify-content:space-between;color:var(--mut);font-size:14px;margin:8px 2px}
.bar{height:5px;background:var(--line);border-radius:9px;overflow:hidden}.bar i{display:block;height:100%;background:var(--pri);transition:width .25s}
.slide{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:clamp(16px,4vw,32px);margin-top:12px;min-height:420px}
.slide h2{margin:0 0 4px;font-size:clamp(20px,4.6vw,28px);color:var(--pri)}
.slide .sub{color:var(--mut);margin:0 0 14px;font-size:14px}
.slide ul{margin:0;padding-left:20px}.slide li{margin:8px 0}
.slide b{color:var(--pri)}
.ex{margin-top:16px;background:var(--exbg);border-left:4px solid var(--acc);border-radius:10px;padding:12px 14px;font-size:15px}
.ex strong{color:var(--acc)}
.nav{display:flex;justify-content:space-between;gap:10px;margin-top:14px}
.nav button{flex:1;padding:12px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--ink);font:inherit;font-weight:600;cursor:pointer}
.nav button:disabled{opacity:.4;cursor:default}
.dots{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;margin-top:12px}
.dots button{width:11px;height:11px;border-radius:50%;border:0;background:var(--line);cursor:pointer;padding:0}.dots button.on{background:var(--pri)}
</style>
</head>
<body>
<div class="top">Les fiches de révisions – Recrutement : le sourcing</div>
<div class="tabs" role="tablist" id="tabs"></div>
<main>
 <div class="meta"><span id="deckname"></span><span id="count"></span></div>
 <div class="bar"><i id="prog"></i></div>
 <section class="slide" id="slide" aria-live="polite"></section>
 <div class="nav"><button id="prev">← Précédent</button><button id="next">Suivant →</button></div>
 <div class="dots" id="dots"></div>
</main>
<script>
const D=[
{n:"Les fondamentaux",s:[
{t:"1. Définition et enjeux du sourcing",u:["<b>Sourcing</b> : ensemble des actions pour identifier, attirer et contacter des candidats qualifiés, avant la sélection. Il se situe après l’analyse du besoin (fiche de poste) et avant le tri des CV et les entretiens.","<b>Sourcing ≠ sélection</b> : le sourcing remplit le « vivier » (quantité et qualité des candidats) ; la sélection évalue et choisit (grille, entretiens).","<b>Enjeux</b> : pourvoir les <b>métiers en tension</b>, réduire le time to fill et le coût par embauche, diversifier les profils, renforcer la marque employeur, constituer un vivier réutilisable.","<b>Contexte</b> : le marché est souvent favorable aux candidats ; les meilleurs profils sont en poste (candidats passifs) et ne répondent pas aux annonces."],e:"Un développeur senior en poste ne consulte pas les annonces. Seule une approche directe sur LinkedIn ou via un réseau peut l’atteindre : c’est du sourcing actif."},
{t:"2. Préparer le sourcing : cible, persona, EVP",u:["<b>Cartographie du marché</b> : où se trouvent les candidats (entreprises concurrentes, écoles, communautés, réseaux), combien, à quel salaire ?","<b>Persona candidat</b> : profil type (âge de carrière, motivations, canaux utilisés, freins). Non discriminatoire : il décrit des comportements, pas une personne.","<b>EVP</b> (<i>Employee Value Proposition</i>) : ce que l’entreprise promet en échange du travail (rémunération, projets, télétravail, formation, culture). Elle doit être vraie et vérifiable.","<b>Marque employeur</b> : image perçue (avis Glassdoor, réseaux sociaux, site carrière, ambassadeurs internes). Elle conditionne le taux de réponse.","<b>Choix de la stratégie</b> : sourcing passif (j’attends les candidats) ou actif (je vais les chercher) selon la tension du métier."],e:"Persona « développeur back-end 5-8 ans d’expérience » : motivé par les projets techniques, le télétravail et la formation ; utilise LinkedIn, GitHub, Stack Overflow, des meetups."},
{t:"3. Sourcing interne",u:["<b>Mobilité interne</b> : poste ouvert d’abord aux salariés (bourse à l’emploi, intranet). Avantages : motivation, connaissance de l’entreprise, onboarding court. Limite : crée un poste vacant ailleurs.","<b>Promotion</b> : évolution verticale d’un salarié.","<b>Cooptation</b> : un salarié recommande un candidat, souvent avec une prime versée après la période d’essai. Avantages : rapide, moins cher, meilleure rétention. Risque : réseau homogène, discrimination indirecte, favoritisme.","<b>Vivier interne et candidatures spontanées</b> : CVthèque, anciens candidats, anciens stagiaires, alternants, intérimaires, alumni (anciens salariés partis en bons termes).","<b>Information du CSE</b> et respect des accords internes de mobilité."],e:"Cooptation : prime de 1 500 € versée au salarié 6 mois après l’embauche. Pour 2 embauches, coût de 3 000 € contre 16 000 € pour un cabinet à 20 % d’un salaire de 40 000 €."},
{t:"4. Sourcing externe : les canaux",u:["<b>Job boards généralistes</b> (Indeed, HelloWork) et <b>spécialisés</b> (Welcome to the Jungle, sites métiers).","<b>Réseaux sociaux professionnels</b> : LinkedIn (annonces, Recruiter, InMail), réseaux métiers (GitHub pour les développeurs).","<b>Service public</b> : France Travail, APEC (cadres), Cap emploi (travailleurs handicapés), missions locales (jeunes).","<b>Écoles et universités</b> : forums, job dating, alternance, stages, partenariats pédagogiques.","<b>Site carrière</b> de l’entreprise et candidatures spontanées.","<b>Intermédiaires</b> : cabinets de recrutement (honoraires souvent 15 à 25 % du salaire brut annuel), chasse de têtes (approche directe), agences d’intérim.","<b>Événements</b> : salons, meetups, hackathons, journées portes ouvertes."],e:"Choisir un canal selon le métier : ouvriers et opérateurs → France Travail et intérim ; juniors → écoles et alternance ; cadres → APEC et LinkedIn ; profils rares → chasse."},
{t:"5. Sourcing actif, passif et techniques de recherche",u:["<b>Sourcing passif</b> : publier et attendre (annonce, site carrière). Peu coûteux, mais ne touche pas les candidats en poste.","<b>Sourcing actif</b> : repérer des profils et les contacter (<b>approche directe</b>) : recherche sur LinkedIn, GitHub, communautés, CVthèques.","<b>Recherche booléenne</b> (opérateurs AND, OR, NOT, guillemets, parenthèses) : exemple « développeur » AND (Python OR Java) NOT stagiaire. Le <b>X-ray search</b> interroge un site via un moteur de recherche.","<b>Message d’approche</b> : court, personnalisé, avec le projet, l’EVP et un appel à l’action (échange de 15 minutes). Taux de réponse typique faible : travailler le ciblage.","<b>Vivier / talent pool</b> : base de profils intéressants non retenus ou non disponibles, entretenue par un CRM de recrutement (relances, newsletters)."],e:"Message d’approche correct : « Votre projet sur le moteur de recommandation m’a intéressé. Nous construisons une équipe data à Lyon, télétravail 3 jours. Un échange de 15 minutes cette semaine ? »"}]},

{n:"Annonce, droit, mesure",s:[
{t:"1. Rédiger une annonce efficace",u:["<b>Source</b> : la fiche de poste, mais en version attractive.","<b>Structure</b> : titre clair et recherché (intitulé réel, pas de jargon interne) ; accroche sur l’entreprise et le projet ; missions (5 à 7) ; profil (indispensable / souhaité) ; avantages et EVP ; process de recrutement ; contact.","<b>Bonnes pratiques</b> : honnêteté, précision, écriture inclusive (Chargé(e) de…), indication du lieu, du contrat, de la rémunération ou de sa fourchette, appel à candidature simple (CV + 1 clic).","<b>Référencement</b> : mots-clés des moteurs et des job boards, titre standard du marché.","<b>Mobile-first</b> : candidature courte pour limiter l’abandon."],e:"Titre incorrect : « Ninja du code ». Titre correct : « Développeur(se) back-end Python – CDI – Lyon, télétravail 3 jours ». Moins créatif, mais mieux référencé."},
{t:"2. Cadre légal de l’annonce et du sourcing",u:["<b>Annonce licite</b> : aucune mention discriminatoire (art. L1132-1, plus de 25 critères : origine, sexe, âge, situation de famille, handicap, opinions…) ni mensongère (art. L5331-2).","<b>Informations demandées</b> : seulement celles utiles pour apprécier l’aptitude au poste (art. L1221-6).","<b>Sanction pénale de la discrimination à l’embauche</b> : jusqu’à 3 ans d’emprisonnement et 45 000 € d’amende (art. 225-2 du Code pénal).","<b>Transparence salariale</b> : la directive européenne 2023/970 impose d’informer le candidat sur la rémunération initiale ou sa fourchette avant l’entretien ; vérifier l’état de la transposition en droit français.","<b>RGPD et approche directe</b> : informer la personne contactée (source des données, finalité, droits) au plus tard dans le mois, ou dès le premier contact ; conservation des CV et profils : 2 ans maximum après le dernier contact (recommandation CNIL).","<b>Recours à un cabinet ou à l’intérim</b> : l’entreprise reste responsable de la non-discrimination."],e:"« Cherche jeune diplômé de moins de 28 ans » : mention d’âge discriminatoire. L’entreprise peut être sanctionnée, même si l’annonce a été rédigée par un cabinet."},
{t:"3. Outils du sourcing",u:["<b>ATS</b> (<i>Applicant Tracking System</i>) : centralise annonces, candidatures, statuts, tests et historiques ; mesure les indicateurs.","<b>Multiposting</b> : diffusion d’une annonce sur plusieurs job boards en une seule saisie.","<b>CVthèque et CRM de recrutement</b> : alimenter et relancer un vivier (candidats passifs, silver medalists).","<b>Outils LinkedIn</b> : Recruiter, alertes, recherche avancée ; <b>programmes d’ambassadeurs</b> et pages carrière.","<b>Candidate experience</b> : rapidité de réponse, accusé de réception, retour motivé à chaque candidat, clarté du process. Une mauvaise expérience nuit à la marque employeur."],e:"Un candidat non retenu qui reçoit une réponse personnalisée en 5 jours peut devenir client, ambassadeur ou futur candidat. Sans réponse, il dégrade l’image de l’entreprise sur Glassdoor."},
{t:"4. Mesurer le sourcing : indicateurs et coût par source",u:["<b>Coût par source</b> = dépenses du canal ÷ nombre d’embauches issues de ce canal.","<b>Taux de transformation</b> = embauches ÷ candidatures × 100. Entonnoir : candidatures → présélections → entretiens → finalistes → embauches.","<b>Time to fill</b> par canal ; <b>taux de réponse</b> aux messages d’approche ; <b>qualité de source</b> : rétention et performance à 12 mois.","<b>Diversité des sources</b> : éviter la dépendance à un seul canal.","<b>Décision</b> : arbitrer le budget vers les canaux au meilleur rapport coût, délai et qualité."],e:"LinkedIn : 3 000 € pour 2 embauches = 1 500 €/embauche. Cooptation : 1 000 € de primes pour 2 embauches = 500 €. Cabinet : 8 000 € (20 % de 40 000 €) pour 1 embauche = 8 000 €. Entonnoir : 200 candidatures → 12 entretiens → 2 embauches = 1 % de transformation."}]},

{n:"Cas fil rouge",s:[
{t:"1. Énoncé : DATAFLOW recrute 4 développeurs",u:["<b>Entreprise</b> : scale-up de 120 salariés (logiciel SaaS), Lyon, forte croissance.","<b>Besoin</b> : 4 développeurs back-end (5-8 ans d’expérience, Python/Java) en CDI sous 4 mois ; métier en tension.","<b>Budget</b> : 24 000 €. Marque employeur peu visible, turnover tech de 22 %, aucune cooptation formalisée.","<b>Constat</b> : 3 mois d’annonces sur un job board généraliste, 80 candidatures, 2 entretiens, 0 embauche.","<b>Travail demandé</b> : (1) diagnostiquer l’échec ; (2) proposer un persona et une EVP ; (3) définir un mix de canaux et un budget ; (4) fixer des indicateurs et les risques."],e:"Diagnostic : le canal est mal choisi (profils en poste donc passifs), l’annonce est peu attractive et la marque employeur trop faible pour attirer en sourcing passif."},
{t:"2. Corrigé : stratégie, canaux et budget",u:["<b>Persona</b> : développeur back-end en poste, motivé par les projets techniques, le télétravail (3 jours) et la formation ; actif sur LinkedIn, GitHub, meetups.","<b>EVP</b> : projets à forte échelle, télétravail, budget formation, équipe tech visible (blog, talks).","<b>Mix de canaux (24 000 €)</b> : cooptation avec prime (4 000 €) ; LinkedIn Recruiter et approche directe (6 000 €) ; écoles et bootcamps, meetups (3 000 €) ; job boards spécialisés tech (4 000 €) ; cabinet en secours pour les 2 derniers postes (7 000 €).","<b>Calendrier</b> : mois 1 refonte de l’annonce et lancement de la cooptation ; mois 2 approche directe et événements ; mois 3 entretiens et offres ; mois 4 relance et plan B (cabinet, alternance).","<b>Indicateurs</b> : taux de réponse aux messages (objectif 20 %), coût par embauche et par source, time to fill (objectif 90 jours), taux de transformation.","<b>Risques</b> : contre-offre de l’employeur actuel, pénurie, discrimination dans la cooptation, non-conformité RGPD de l’approche directe."],e:"Message d’approche + information RGPD + annonce réécrite (« Développeur(se) back-end Python – télétravail 3 jours ») : trois actions simples et peu coûteuses à mener dès la semaine 1."},
{t:"3. À retenir et flashcards",u:["<b>Sourcing</b> ? Identifier et attirer les candidats avant la sélection.","<b>Actif ou passif ?</b> Actif pour les profils rares et en poste, passif pour les profils abondants.","<b>Un canal par métier</b> : opérateurs → France Travail et intérim ; juniors → écoles ; cadres → APEC et LinkedIn ; rares → chasse.","<b>Cooptation</b> : rapide et peu chère, mais risque d’homogénéité.","<b>Coût par embauche</b> ? Dépenses du canal ÷ embauches de ce canal.","<b>Annonce licite</b> ? Pas de mention discriminatoire ni mensongère (L1132-1, L5331-2).","<b>Approche directe et RGPD</b> ? Informer la personne contactée, conserver 2 ans maximum.","<b>Méthode de réponse</b> : diagnostic → persona et EVP → canaux et budget → calendrier → indicateurs → risques."],e:"Question piège : « Le meilleur canal est-il toujours le moins cher ? » Non : il faut comparer coût, délai et qualité (rétention), selon le métier."}]}
];
let d=0,i=0;const $=id=>document.getElementById(id);
function render(){const k=D[d],s=k.s[i];
$("deckname").textContent="Fiche "+(d+1)+" : "+k.n;$("count").textContent="Slide "+(i+1)+" / "+k.s.length;
$("prog").style.width=((i+1)/k.s.length*100)+"%";
$("slide").innerHTML="<h2>"+s.t+"</h2><p class='sub'>"+k.n+" · Sourcing · Bachelor RH 3e année</p><ul>"+s.u.map(x=>"<li>"+x+"</li>").join("")+"</ul>"+(s.e?"<div class='ex'><strong>Exemple / à retenir :</strong> "+s.e+"</div>":"");
$("prev").disabled=i===0;$("next").disabled=i===k.s.length-1;
$("dots").innerHTML=k.s.map((_,j)=>"<button class='"+(j===i?"on":"")+"' aria-label='Slide "+(j+1)+"' data-j='"+j+"'></button>").join("");
document.querySelectorAll("#tabs button").forEach((b,j)=>b.setAttribute("aria-selected",j===d));}
$("tabs").innerHTML=D.map((k,j)=>"<button role='tab' data-d='"+j+"'>"+k.n+"</button>").join("");
$("tabs").onclick=e=>{const b=e.target.closest("button");if(b){d=+b.dataset.d;i=0;render();window.scrollTo(0,0)}};
$("dots").onclick=e=>{const b=e.target.closest("button");if(b){i=+b.dataset.j;render()}};
$("prev").onclick=()=>{if(i>0){i--;render()}};$("next").onclick=()=>{if(i<D[d].s.length-1){i++;render()}};
document.onkeydown=e=>{if(e.key==="ArrowRight")$("next").click();if(e.key==="ArrowLeft")$("prev").click()};
render();
</script>
</body>
</html>
